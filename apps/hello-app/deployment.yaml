apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-app
  namespace: default

spec:
  replicas: 3

  selector:
    matchLabels:
      app: hello-app

  template:
    metadata:
      labels:
        app: hello-app

    spec:
      containers:
        - name: hello-app
          image: nginx:1.27-alpine

          ports:
            - containerPort: 80
