apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-app
  namespace: default

spec:
  replicas: 3

  selector:
    matchLabels:
      app: hello-app

  template:
    metadata:
      labels:
        app: hello-app

    spec:
      containers:
        - name: hello-app
          image: ghcr.io/cheating-at-solitaire/pipeline-lab:5404d784e25016edddd41bff5d4ce9be9f69ab93
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
